name: Machine checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  # Ghost and Recur need the sample-overview SDK change still in review
  # (etcetc000/open-xy#182); move them to staging once it merges.
  SAMPLE_SDK_REPO: mmockett/open-xy
  SAMPLE_SDK_REF: sdk/sample-overview
jobs:
  # Each machine's records, browser preview, drawing checks and host sound
  # tests. The native compile needs the pinned Blackfin tools, which this Linux
  # runner doesn't have.
  synths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nonagon
      - uses: actions/checkout@v4
        with:
          repository: etcetc000/open-xy
          ref: staging
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preview and host tools
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Machine source, preview and sound checks
        run: |
          for machine in sand cocoa coin fermi mach butterfly drop; do
            python open-xy/sdk.py test --machine "nonagon/$machine" --cxx clang++ --host-cxx g++ || exit 1
          done
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nonagon
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SAMPLE_SDK_REPO }}
          ref: ${{ env.SAMPLE_SDK_REF }}
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preview and host tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          python -m pip install numpy==2.3.5
      - name: Machine source and sound checks
        run: |
          for machine in ghost recur; do
            python open-xy/sdk.py test --machine "nonagon/$machine" --cxx clang++ --host-cxx g++ || exit 1
          done
